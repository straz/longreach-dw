# tyapi's API description (`python -m gateway.openapi`) at 09eb0e2 plus its working tree.
# Update with `pnpm api:pull`, then `pnpm gen:api`.
openapi: 3.1.0
info:
  title: Longreach API
  description: 'The Longreach API. Every route but `/v1/healthz` needs a Longreach API key as

    `Authorization: Bearer lr_…`. The data routes under `/v1/graphs` need a `Graphs-Http-Api: 0.14`

    header and answer with the same header. `/v1/mcp` serves the data routes to MCP clients. Every date

    the API gives is an ISO-8601 instant in UTC, such as `2027-03-31T10:00Z`. It takes that, an instant with

    its offset, or a calendar day (`2027-03-31`, its midnight UTC); a time without its zone is refused, never

    assumed. A web app on an allowed origin signs in at `/auth/login` instead of

    using a key, and sends the session cookie; its changes name it in `X-Longreach-Client`.'
  version: '1'
