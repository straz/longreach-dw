components:
  schemas:
    Assumptions:
      properties:
        text:
          type: string
          title: Text
        span:
          anyOf:
          - type: string
          - type: 'null'
          title: Span
          description: In a sample document, the marked passage the value was read from
        field:
          type: string
          const: assumptions
          title: Field
        beliefs:
          items:
            $ref: '#/components/schemas/BeliefRef'
          type: array
          title: Beliefs
      type: object
      required:
      - text
      - field
      - beliefs
      title: Assumptions
    Authorization:
      properties:
        statement:
          type: string
          title: Statement
        decided_at:
          type: string
          title: Decided At
          description: 'An ISO-8601 date: given as an instant in UTC; taken as that, as an instant with its offset, or as
            a calendar day, which is its midnight UTC. A time with no zone is refused'
          examples:
          - 2027-03-31T10:00Z
          - '2027-03-31'
        by:
          type: string
          maxLength: 200
          minLength: 1
          title: By
        under:
          type: string
          maxLength: 200
          minLength: 1
          title: Under
      type: object
      required:
      - statement
      - decided_at
      - by
      - under
      title: Authorization
    AvailablePath:
      properties:
        available:
          type: boolean
          const: true
          title: Available
          default: true
        means:
          type: string
          title: Means
        mandate:
          type: string
          maxLength: 200
          minLength: 1
          title: Mandate
          description: The mandate a decision on this path is made under
        incremental:
          type: number
          title: Incremental
        incremental_note:
          anyOf:
          - type: string
          - type: 'null'
          title: Incremental Note
        avoided:
          type: number
          title: Avoided
        deferred:
          type: number
          title: Deferred
        uncertainty:
          type: string
          title: Uncertainty
        narrows:
          anyOf:
          - $ref: '#/components/schemas/Narrows'
          - type: 'null'
        deadline:
          anyOf:
          - type: string
            description: 'An ISO-8601 date: given as an instant in UTC; taken as that, as an instant with its offset, or as
              a calendar day, which is its midnight UTC. A time with no zone is refused'
            examples:
            - 2027-03-31T10:00Z
            - '2027-03-31'
          - type: 'null'
          title: Deadline
        reasons:
          items:
            $ref: '#/components/schemas/Reason'
          type: array
          title: Reasons
          default: []
        effects:
          $ref: '#/components/schemas/Effects'
          default:
            transitions: []
            readings: []
            exercises: []
      type: object
      required:
      - means
      - mandate
      - incremental
      - avoided
      - deferred
      - uncertainty
      title: AvailablePath
    BeliefRef:
      properties:
        belief:
          type: string
          maxLength: 200
          minLength: 1
          title: Belief
        necessary:
          type: boolean
          title: Necessary
      type: object
      required:
      - belief
      - necessary
      title: BeliefRef
    Brief:
      properties:
        slug:
          type: string
          maxLength: 200
          minLength: 1
          title: Slug
        title:
          type: string
          title: Title
        commitments:
          items:
            type: string
            maxLength: 200
            minLength: 1
          type: array
          title: Commitments
          description: The commitments the brief reconsiders
        related:
          items:
            type: string
            maxLength: 200
            minLength: 1
          type: array
          title: Related
          default: []
        beliefs:
          items:
            type: string
            maxLength: 200
            minLength: 1
          type: array
          title: Beliefs
        review:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Review
          description: The seeded review that decided it
        supersedes:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Supersedes
          description: A brief this one opens after, once that one's revisit date arrives
        paths:
          additionalProperties:
            anyOf:
            - $ref: '#/components/schemas/AvailablePath'
            - $ref: '#/components/schemas/UnavailablePath'
          propertyNames:
            enum:
            - continue
            - change
            - delay
            - exit
          type: object
          title: Paths
          default: {}
      type: object
      required:
      - slug
      - title
      - commitments
      - beliefs
      title: Brief
    Capital:
      properties:
        text:
          type: string
          title: Text
        span:
          anyOf:
          - type: string
          - type: 'null'
          title: Span
          description: In a sample document, the marked passage the value was read from
        field:
          type: string
          const: capital
          title: Field
        amount:
          type: number
          title: Amount
        until:
          anyOf:
          - type: string
            description: 'An ISO-8601 date: given as an instant in UTC; taken as that, as an instant with its offset, or as
              a calendar day, which is its midnight UTC. A time with no zone is refused'
            examples:
            - 2027-03-31T10:00Z
            - '2027-03-31'
          - type: 'null'
          title: Until
      type: object
      required:
      - text
      - field
      - amount
      title: Capital
    DecisionIn:
      properties:
        brief:
          type: string
          maxLength: 200
          minLength: 1
          title: Brief
        path:
          type: string
          enum:
          - continue
          - change
          - delay
          - exit
          title: Path
        rationale:
          type: string
          title: Rationale
        conditions:
          anyOf:
          - type: string
          - type: 'null'
          title: Conditions
        revisit_at:
          anyOf:
          - type: string
            description: 'An ISO-8601 date: given as an instant in UTC; taken as that, as an instant with its offset, or as
              a calendar day, which is its midnight UTC. A time with no zone is refused'
            examples:
            - 2027-03-31T10:00Z
            - '2027-03-31'
          - type: 'null'
          title: Revisit At
          description: Overrides the path's revisit date
        approval:
          type: string
          enum:
          - own
          - agreed
          - request
          title: Approval
          description: 'own: under the persona''s mandate; agreed: with the mandate holder''s agreement; request: sent to
            the holder for approval'
      type: object
      required:
      - brief
      - path
      - rationale
      - approval
      title: DecisionIn
    DeletedOut:
      properties:
        graph:
          type: string
          title: Graph
        branch:
          type: string
          title: Branch
        type:
          type: string
          title: Type
        deleted:
          type: string
          title: Deleted
          description: The record's slug, or the link's ends
        links_removed:
          type: integer
          title: Links Removed
          description: Links that went with a deleted record
          default: 0
        graph_commit_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Graph Commit Id
      type: object
      required:
      - graph
      - branch
      - type
      - deleted
      - graph_commit_id
      title: DeletedOut
    DemoListing:
      properties:
        graph:
          type: string
          title: Graph
        org:
          type: string
          title: Org
        org_name:
          type: string
          title: Org Name
        project:
          type: string
          title: Project
        name:
          type: string
          title: Name
        persona:
          $ref: '#/components/schemas/Persona'
        frame:
          $ref: '#/components/schemas/Frame'
        briefs:
          type: integer
          title: Briefs
          description: How many reconsideration briefs it has; none for a demo with records only
        documents:
          type: integer
          title: Documents
          description: How many sample documents it offers to import
      type: object
      required:
      - graph
      - org
      - org_name
      - project
      - name
      - persona
      - frame
      - briefs
      - documents
      title: DemoListing
    DemoOut:
      properties:
        graph:
          type: string
          title: Graph
        org:
          type: string
          title: Org
        project:
          type: string
          title: Project
        name:
          type: string
          title: Name
        party:
          type: string
          title: Party
          description: The org's party in the graph, which its commitments bind
        persona:
          $ref: '#/components/schemas/Persona'
        frame:
          $ref: '#/components/schemas/Frame'
        briefs:
          items:
            $ref: '#/components/schemas/Brief'
          type: array
          title: Briefs
          description: Each reconsideration brief, with its paths
        documents:
          items:
            $ref: '#/components/schemas/Document'
          type: array
          title: Documents
          description: The sample documents, with their extracted fields
        indicators:
          additionalProperties:
            $ref: '#/components/schemas/Indicator'
          type: object
          title: Indicators
          description: How each metric is named and shown, by metric
      type: object
      required:
      - graph
      - org
      - project
      - name
      - party
      - persona
      - frame
      - briefs
      - documents
      - indicators
      title: DemoOut
    DemosOut:
      properties:
        demos:
          items:
            $ref: '#/components/schemas/DemoListing'
          type: array
          title: Demos
          description: The demos the caller can open, by name
      type: object
      required:
      - demos
      title: DemosOut
    Dependencies:
      properties:
        text:
          type: string
          title: Text
        span:
          anyOf:
          - type: string
          - type: 'null'
          title: Span
          description: In a sample document, the marked passage the value was read from
        field:
          type: string
          const: dependencies
          title: Field
        'on':
          items:
            $ref: '#/components/schemas/DependencyRef'
          type: array
          title: 'On'
      type: object
      required:
      - text
      - field
      - 'on'
      title: Dependencies
    DependencyRef:
      properties:
        commitment:
          type: string
          maxLength: 200
          minLength: 1
          title: Commitment
        kind:
          type: string
          enum:
          - requires
          - funds
          - precedes
          - assumes
          - other
          title: Kind
      type: object
      required:
      - commitment
      - kind
      title: DependencyRef
    Document:
      properties:
        slug:
          type: string
          maxLength: 200
          minLength: 1
          title: Slug
        sample:
          type: boolean
          title: Sample
          description: Offered for import; the others are already recorded
        kind:
          type: string
