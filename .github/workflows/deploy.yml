# Build Decision Watch and publish only the built app to GitHub Pages, at https://dw.longreach.ai
# (docs/PLAN.md §7). The repository's Pages source must be "GitHub Actions" (Settings → Pages), so the
# source and docs/ are never served; the custom domain is public/CNAME, copied into the build.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # the version package.json's packageManager names
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # runs scripts/*.ts directly
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
        env:
          VITE_API_URL: https://api.longreach.ai
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
